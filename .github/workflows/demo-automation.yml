name: Demo Automation Workflow

# This workflow demonstrates how to automate tasks and report progress
# It runs automatically on push to specific branches or manually via workflow_dispatch

on:
  # Allow manual triggering from the Actions tab
  workflow_dispatch:
    inputs:
      task_name:
        description: 'Name of the task to run'
        required: false
        default: 'demo-task'
        type: string
  
  # Automatically run on push to main or feature branches
  push:
    branches:
      - main
      - 'feature/**'
      - 'demo/**'
  
  # Run on pull requests
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  setup:
    name: Setup and Prepare
    runs-on: ubuntu-latest
    outputs:
      task-name: ${{ steps.set-task.outputs.name }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set task name
        id: set-task
        run: |
          TASK_NAME="${{ github.event.inputs.task_name || 'automated-task' }}"
          echo "name=$TASK_NAME" >> $GITHUB_OUTPUT
          echo "::notice::Starting task: $TASK_NAME"
      
      - name: Report setup complete
        run: |
          echo "✅ Setup completed successfully"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Report build start
        run: echo "🔨 Starting build process..."
      
      - name: Build project
        run: |
          cargo build --verbose
          echo "✅ Build completed successfully"
      
      - name: Report build complete
        run: |
          echo "::notice::Build phase completed"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Report test start
        run: echo "🧪 Starting test execution..."
      
      - name: Run tests
        run: |
          cargo test --verbose
          echo "✅ All tests passed"
      
      - name: Report test results
        run: |
          echo "::notice::Test phase completed successfully"

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      
      - name: Report lint start
        run: echo "🔍 Starting code quality checks..."
      
      - name: Check formatting
        run: |
          cargo fmt -- --check
          echo "✅ Code formatting check passed"
      
      - name: Run Clippy
        run: |
          cargo clippy -- -D warnings
          echo "✅ Clippy checks passed"
      
      - name: Report lint complete
        run: |
          echo "::notice::Code quality checks completed"

  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [setup, build, test, lint]
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Generate summary
        run: |
          echo "# Workflow Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Task Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Task Name**: ${{ needs.setup.outputs.task-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Setup: ${{ needs.setup.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Workflow completed!" >> $GITHUB_STEP_SUMMARY
      
      - name: Report workflow complete
        run: |
          echo "::notice::All tasks completed. Check the summary for details."
          echo "🎉 Workflow execution finished successfully!"
      
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `## 🤖 Automated Workflow Results
            
            All checks have completed for this pull request!
            
            **Status Summary:**
            - ✅ Setup: ${{ needs.setup.result }}
            - ✅ Build: ${{ needs.build.result }}
            - ✅ Test: ${{ needs.test.result }}
            - ✅ Lint: ${{ needs.lint.result }}
            
            **Task:** ${{ needs.setup.outputs.task-name }}
            **Commit:** ${{ github.sha }}
            
            This automated workflow demonstrates task execution and progress reporting using GitHub Actions.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
